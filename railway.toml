# One Source — single Railway service (shop + API + admin)
# https://docs.railway.com/guides/config-as-code

[build]
# Use npm install (not ci): Railway caches can lock node_modules/.vite and
# make `npm ci`'s rmdir fail with EBUSY.
# Keep Vite's cache off the mounted node_modules tree.
buildCommand = "npm install && npm install --prefix server && VITE_CACHE_DIR=/tmp/vite-cache npm run build"

[deploy]
# Shop is already in dist/; only start the API (serves dist + /api + /admin).
startCommand = "npm start --prefix server"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
