<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>One Source — Everything on One Place</title>
    <meta
      name="description"
      content="One Source — Everything on One Place. Shop fresh foods, kitchen ware, and everyday essentials from one trusted store."
    />
    <meta name="theme-color" content="#244a3b" />

    <!-- Open Graph / WhatsApp / iMessage link previews -->
    <meta property="og:site_name" content="One Source" />
    <meta property="og:title" content="One Source — Everything on One Place" />
    <meta
      property="og:description"
      content="Shop fresh foods, kitchen ware, and everyday essentials — all in one place."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__OG_ORIGIN__/" />
    <meta property="og:image" content="__OG_ORIGIN__/brand/logo-on-dark-stacked.png" />
    <meta property="og:image:alt" content="One Source" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="One Source — Everything on One Place" />
    <meta
      name="twitter:description"
      content="Shop fresh foods, kitchen ware, and everyday essentials — all in one place."
    />
    <meta name="twitter:image" content="__OG_ORIGIN__/brand/logo-on-dark-stacked.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #244a3b;
      }
      #app-loader .app-loader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.85rem;
        padding: 1.25rem;
        text-align: center;
      }
      #app-loader .app-loader-slogan {
        margin: 0;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        font-size: clamp(0.95rem, 3.4vw, 1.25rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        color: rgba(255, 255, 255, 0.95);
        white-space: nowrap;
      }
      #app-loader .app-loader-bar {
        width: min(9.5rem, 48vw);
        height: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      #app-loader .app-loader-bar span {
        display: block;
        height: 100%;
        width: 38%;
        border-radius: inherit;
        background: rgba(240, 201, 71, 0.9);
        animation: app-loader-slide 1.2s ease-in-out infinite;
      }
      @keyframes app-loader-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div id="app-loader" aria-hidden="true">
      <div class="app-loader-inner">
        <p class="app-loader-slogan">Everything on One Place</p>
        <div class="app-loader-bar"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
